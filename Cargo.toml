[package]
name = "livepeer-funds-transfer"
version = "0.0.9"
edition = "2024"
publish = false

[dependencies]
# Framework Level Deps
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Ethereum Deps (default features include rustls TLS)
alloy = { version = "2.6.1", features = ["signer-keystore"] }

[dev-dependencies]
alloy = { version = "2.6.1", features = ["json-rpc", "k256", "node-bindings"] }
proptest = "1.12.0"
serde = "1.0.229"
serde_json = "1.0.154"
tower = "0.5.3"
