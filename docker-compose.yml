services:
  funds-transfer:
    image: tztcloud/livepeer-funds-transfer:0.0.9
    container_name: "funds-transfer"
    hostname: "funds-transfer"
    restart: unless-stopped
    # Hardening: the image runs as UID/GID 10001; nothing in the container is writable or
    # privileged, since the app only reads its key files and talks to the RPC.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # -----------------------------
      # RPC / CHAIN
      # -----------------------------
      HTTP_RPC_URL: "https://arb1.arbitrum.io/rpc"
      CHAIN_ID: "42161"

      # -----------------------------
      # CONTRACT ADDRESSES
      # -----------------------------
      ROUNDS_MANAGER_ADDR: "0xdd6f56DcC28D3F5f27084381fE8Df634985cc39f"
      BONDING_MANAGER_ADDR: "0x35Bcf3c30594191d53231E4FF333E8A770453e40"

      # -----------------------------
      # KEYSTORE / SECRETS (PATHS ONLY)
      # -----------------------------
      # The volume is mounted at /keys; UID 10001 must be able to read both files.
      JSON_KEY_FILE: "/keys/orchestrator_keystore.json"
      PASSPHRASE_FILE: "/keys/orchestrator_passphrase.txt"

      # Optional — if omitted, derived from keystore
      ORCHESTRATOR_ADDR: "0xYourOrchestratorAddress"

      # -----------------------------
      # LOOP TIMING
      # -----------------------------
      LOOP_SLEEP_SECS: "60"
      RECEIPT_TIMEOUT_SECS: "90"

      # -----------------------------
      # TX FEES
      # -----------------------------
      # maxFeePerGas = baseFee * MAX_FEE_BASE_MULTIPLIER + MAX_PRIORITY_FEE_WEI
      MAX_FEE_BASE_MULTIPLIER: "2"
      MAX_PRIORITY_FEE_WEI: "0"

      ############################################
      # Reward Call SETTINGS
      ############################################
      ENABLE_REWARD: "true"

      # -----------------------------
      # LPT BOND TRANSFER
      # -----------------------------
      ENABLE_TRANSFER_BOND: "true"
      # Minimum bonded LPT to keep on orchestrator (wei)
      LPT_MIN_RETAIN_WEI: "1000000000000000000" # 1 LPT

      # Recipient of transferred bond
      LPT_RECEIVER_ADDR: "0xYourStakeOrTreasuryAddress"

      # -----------------------------
      # FEE WITHDRAWAL
      # -----------------------------
      ENABLE_WITHDRAW_FEES: "true"
      ETH_FEE_WITHDRAW_THRESHOLD_WEI: "1000000000000000" # 0.001 ETH
      ETH_FEE_RECEIVER_ADDR: "0xYourFeeRecipientAddress"

      # -----------------------------
      # LOGGING
      # -----------------------------
      RUST_LOG: "info"
    volumes:
      - lpData:/keys:ro
volumes:
  lpData:
    external: true
